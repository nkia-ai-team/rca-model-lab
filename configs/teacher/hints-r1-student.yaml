# 학생 힌트 수집 1라운드 (① 오답 배제 + 한 홉 더). 정답 대상명·기전 비노출. 라이브 프롬프트 전용, 저장 궤적엔 없음.
# 실패 양상 (rollouts-v1, 무힌트): 첫 영향 서비스에서 멈추고 발원지까지 한 홉을 더 안 감.
case-f01-p-v3-d691440c: |
  이전 조사 판정: core-banking-transfer 를 원인 대상으로 하고 DB 를 계측 밖 외부로 처리한 결론은 오답 판정. 그 서비스는 영향을 받은 쪽이다.
  이 서비스가 의존하는 대상은 이 환경 안에 target 으로 등록돼 있고 직접 조회할 수 있다. 의존 대상을 검색해 그 대상 자체의 상태(세션·잠금·느린 쿼리)를 실측하고, 발원지를 그 대상으로 좁혀라.
case-f01-h-v3-48ec8e62: |
  이전 조사 판정: commerce-order 를 원인 대상으로 한 결론은 오답 판정. order 의 서킷브레이커는 하류 실패의 결과다.
  order 가 호출한 하류 서비스 중 어느 것이 외부 실패를 상위 오류로 바꿨는지 그 서비스의 로그·트레이스로 실측하고, 경계 대상은 그 서비스로 적어라.
case-f19-p-v3-5a350c0a: |
  이전 조사 판정: MySQL-fooddelivery 의 느린 집계 쿼리를 원인으로 한 결론은 오답 판정. 그 쿼리 지연은 이 창의 사용자 영향과 경로가 다르다.
  사용자 영향이 난 요청 경로(주문·결제)를 따라가 어느 서비스가 어떤 외부 호출에서 실패했는지 로그·트레이스로 실측하라.
case-f03-h-v3-d4192a3b: |
  이전 조사 판정: 호스트 tb-w1 의 부하(k6)·디스크/CPU 지표와 클러스터 설정 변경(change-detect)을 원인으로 한 결론은 오답 판정. 둘 다 배경이다.
  사용자 영향(체크아웃 5xx·지연)이 난 서비스 자체를 보라. 그 서비스의 하류(DB·의존 서비스)가 정상인데도 그 서비스 안에서 요청이 어디서 어떻게 밀리는지(스레드·처리 시간·특정 엔드포인트)를 실측하라.
