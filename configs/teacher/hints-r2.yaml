# 재캡처용 사다리 ① — 원본 r1 힌트 재사용 / 결론 형식·등급·완전성 교정 (정답 단어 없음).
# 2026-09-21 철회: 골든 등급이 규칙 A 로 confirmed 가 되어 아래 provisional 유도 문구는 더 이상 유효하지 않음 (이미 소비된 힌트, 기록용).
# case-f07-h-v3-4ab16f7a: '이전 조사 판정: commerce-cart 커넥션 풀 포화를 원인으로 지목한 결론은 오답 판정. cart 의 포화는 같은 부하 아래 함께 나타난 전파 지점이지 발원지가 아니다.
#
#   발원지는 하나다. 요청 흐름에서 그 하나의 대상이 왜 먼저 막히는지(그 대상 안에서 요청이 얼마나 오래 무엇을 붙들고 있는지)를 실측으로 보이고, 나머지는 결과로 정리하라. 확정 등급은 그 대상의 한도와 실측 도달을 직접 관측했을 때만 준다.
#
#   '
case-f11-r-v3-6366db31: '이전 조사 판정: 대상 지목은 맞지만 결론 형식과 등급이 오답 판정. 원인이 계측 밖 의존(외부 캐시·브로커·API 류)이면 그것은 causes 의 내부 대상이 아니라 external_causes 에 적고, 그 외부 실패가 처음 관측된 내부 서비스를 boundary_target 과 causes 양쪽에 둔다. 외부 의존의 내부 상태는 직접 관측할 수 없으므로 status 는 provisional 까지만 준다 — confirmed 는 직접 인과 관측이 있을 때만이다.'
case-f15-g-v3-fbe95718: '이전 조사 판정: 지목한 대상과 기전은 맞지만 결론이 불완전하다는 판정 — 발원지가 하나라는 가정이 오답이다. seed 의 영향 서비스가 걸친 도메인별로, 그 지목한 발원지의 전파 경로에 속하지 않는 영향이 남아 있는지 확인하라. 남아 있으면 그 도메인 안에서 같은 방법(잠금·대기 세션·느린 쿼리 실측)으로 두 번째 발원지를 찾아 causes 에 함께 적어라.'
# 2026-09-21 철회: 골든 등급이 규칙 A 로 confirmed 가 되어 아래 provisional 유도 문구는 더 이상 유효하지 않음 (이미 소비된 힌트, 기록용).
# case-f16-h-v3-f069f7c9: '이전 조사 판정: 대상 지목과 기전은 맞지만 등급이 오답 판정. confirmed 는 원인 대상의 이상과 영향의 시각·경로가 직접 연결된 관측이 있을 때만 준다. 이 케이스의 원인 대상은 그 내부 상태(왜 준비 실패인지)를 도구로 직접 관측할 수 없고, 관측되는 것은 게이트웨이 쪽의 실패 전환과 대상의 준비 상태 변화뿐이다. 영향 실측이 여럿이어도 직접 인과 관측이 없으면 provisional 이다.'
