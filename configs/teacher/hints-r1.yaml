# 사다리 1라운드 = ① 오답 배제만. 정답 단어(원인 기전·대상명) 비노출. 기록엔 절대 안 들어감 (라이브 프롬프트 전용).
case-f04-r-v3-c508c52d: |
  이전 조사 판정: commerce-gateway/k6 부하, commerce-inventory 재고 예약 409, commerce-cart 낙관적 잠금 실패를 원인으로 지목한 결론은 오답 판정. 부하를 추종해 함께 오르내린 지표는 배경이며 원인이 아니다.
  이번 창의 장애는 그 셋과 무관한 곳에서 시작됐다. 동기 요청 경로가 아니라 비동기 경로(이벤트 발행·소비)의 정상 여부를 각 단계별로 직접 실측하라.
case-f07-h-v3-7de1a36f: |
  이전 조사 판정: commerce-cart 커넥션 풀 포화를 원인으로 지목한 결론은 오답 판정. cart 의 포화는 같은 부하 아래 함께 나타난 전파 지점이지 발원지가 아니다.
  발원지는 하나다. 요청 흐름에서 그 하나의 대상이 왜 먼저 막히는지(그 대상 안에서 요청이 얼마나 오래 무엇을 붙들고 있는지)를 실측으로 보이고, 나머지는 결과로 정리하라. 확정 등급은 그 대상의 한도와 실측 도달을 직접 관측했을 때만 준다.
case-f09-h-v3-0c795f2b: |
  이전 조사 판정: commerce-order 의 배포 롤아웃·파드 교체 자체와 체크아웃 트래픽 버스트를 원인 기전으로 한 결론은 오답 판정. 롤아웃은 원인이 실려 들어온 통로일 뿐이고 트래픽은 배경이다.
  롤아웃 전후로 그 대상의 실행 조건에서 무엇이 달라졌는지, 그리고 그 대상 프로세스 내부 런타임 지표가 창 안에서 어떤 시간 패턴(주기·동기화)으로 응답 지연과 맞물리는지를 실측으로 보여라.
case-f18-p-v3-d2c566ad: |
  이전 조사 판정: k6 부하·트래픽 버스트를 원인으로 하고 "내부 결함 없음"으로 마친 결론은 오답 판정. 부하를 추종한 처리량 지표는 배경이다.
  동기 API 응답이 정상이라는 관측은 이 장애를 배제하지 못한다. 동기 요청 경로가 아니라 비동기 경로(이벤트 발행·소비)의 정상 여부를 각 단계별로, 발행 측과 소비 측을 따로 직접 실측하라.
case-f05-r-v3-527f3692: |
  이전 조사 판정: commerce-payment 의 배포 롤아웃·롤백 반복과 긴 기동 시간 자체를 원인 기전으로 한 결론은 오답 판정. 롤아웃은 원인이 실려 들어온 통로이고, 반복 교체는 결과다.
  파드가 왜 반복해서 종료됐는지 — 각 종료의 직접 사유를 실측으로 밝히고, 그 사유를 만든 조건이 롤아웃 전후로 어떻게 달라졌는지 보여라.
case-f19-p-v3-5a350c0a: |
  이전 조사 판정: food-delivery-dispatch 의 GET /api/deliveries COUNT 풀스캔을 원인에 포함한 결론은 오답 판정. 그 지연은 부하 아래 함께 나타난 배경이며 사용자 영향(결제·주문) 경로와 다르다.
  발원지는 하나다. 사용자 영향 경로에서 실패·지연을 처음 만든 지점만 원인으로 적고, 나머지는 결과나 배경으로 정리하라.
case-f19-s-v3-5daa9c97: |
  이전 조사 판정: food-delivery-dispatch 의 dispatches 풀스캔 COUNT 쿼리를 원인에 포함한 결론은 오답 판정. 부하 아래 함께 나타난 배경이다.
  발원지는 하나다. 사용자 영향(결제·주문 실패) 경로에서 실패를 처음 만든 지점만 원인으로 적어라.
case-f16-h-v3-2f0555c7: |
  이전 조사 판정: commerce-user 의 롤아웃·파드 교체와 기동 시간 자체를 원인 기전으로 한 결론은 오답 판정. 롤아웃은 원인이 실려 들어온 통로다.
  롤아웃 전후로 파드 사양에서 무엇이 달라졌는지, 그리고 기동이 끝난 뒤에도 왜 서비스 endpoints 에서 빠져 있었는지를 실측으로 밝혀라.
case-f14-p-v3-0bdb303b: |
  이전 조사 판정: BANKING.LEDGER_ENTRIES READ ONLY 는 맞으나, 원인 하나가 빠져 결론이 불완전하다 판정.
  실패한 쓰기를 소비하는 쪽이 그 실패를 어떻게 처리했는지(재시도·경보·오프셋 커밋 여부)를 실측하라. 그 처리 방식 자체가 두 번째 원인이다.
case-f11-r-v3-85b9a489: |
  이전 조사 판정: Redis 파드 소멸은 맞으나, 원인 하나가 빠져 결론이 불완전하다 판정. Redis 소멸만으로는 사용자 영향의 크기가 설명되지 않는다.
  Redis 를 잃은 서비스가 그 뒤 동작을 어떻게 바꿨는지(우회 경로), 그 우회가 어디를 포화시켰는지를 시각 순서로 실측하라. 그 서비스의 그 동작이 두 번째 원인이며, 외부 의존 상실은 내부 상태를 직접 관측할 수 없으므로 확정 등급은 그에 맞게 준다.
case-f20-r-v3-caf04820: |
  이전 조사 판정: PostgreSQL-commerce 의 메모리 한도 도달·OOM 재시작을 원인으로 한 결론은 오답 판정. 그것은 결과다. DB 는 공유 자원이라 포화는 누군가가 만든 것이다.
  창 안에서 어느 서비스의 어떤 쿼리가 새로 대량 실행돼 DB 를 그 상태로 몰았는지(느린 쿼리 원천·세션 소유 서비스·실행 계획 특성)를 실측하고, 그 서비스를 발원지로 적어라.
