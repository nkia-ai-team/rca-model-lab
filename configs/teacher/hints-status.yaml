# status 교정 사다리 ① — 대상은 맞고 등급만 틀린 케이스. 정답 대상 단어 없음, 등급 규율만 재진술.
case-f01-p-v3-d691440c: '이전 조사 판정: 대상 지목은 맞지만 결론 등급이 오답 판정. 이 케이스는 원인 대상의 이상과 영향의 시각·경로 연결을 도구로 직접 관측할 수 있다 — 그 직접 인과 관측(원인 대상 지표/로그/이벤트의 시작 시각과 영향 대상의 시작 시각·호출 경로)을 실측으로 인용하면 confirmed 를 준다. 근거 없이 등급만 올리지 말고 그 관측을 찾아 인용하라.'
# 2026-09-21 철회: 골든 등급을 confirmed 로 정정(직접 인과 관측 실측). 아래 ↓ 힌트는 teacher-status 체인에서 이미 소비됐고 그 런은 재채점됨.
# case-f05-p-v3-6fe331ef: '이전 조사 판정: 대상 지목은 맞지만 결론 등급이 오답 판정. confirmed 는 원인 대상의 이상과 영향의 시각·경로가 직접 연결된 관측이 있을 때만 준다. 영향 실측이 여럿이어도 직접 인과 관측이 없으면 provisional 이다. 원인이 계측 밖 의존(외부 API·캐시·브로커)이면 external_causes 에 적고 경계 내부 대상을 boundary_target 과 causes 에 두며, 그 내부 상태를 직접 관측할 수 없으므로 provisional 까지만 준다.'
# 2026-09-21 철회: 골든 등급이 규칙 A 로 confirmed 가 되어 아래 provisional 유도 문구는 더 이상 유효하지 않음 (이미 소비된 힌트, 기록용).
