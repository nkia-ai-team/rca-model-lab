case-f20-r-v3-caf04820: '이전 조사 판정: 원인 목록이 오답 판정. 공유 PostgreSQL 인스턴스의 메모리 한도 도달·CPU 상승은 상류 쿼리 부하가 만든 전파 지점이지 발원지가 아니다. 어느 서비스의 어떤 쿼리 패턴(비인덱스 전체 스캔 류)이 그 부하를 만들었는지 느린 쿼리·트레이스로 추적해 그 서비스 하나만 causes 에 두고, DB 와 같은 DB 를 쓰는 다른 서비스는 영향으로만 기술하라.'
