case-f09-h-v3-0c795f2b: '이전 조사 판정: commerce-order 의 배포 롤아웃·파드 교체 자체와 체크아웃 트래픽 버스트를 원인 기전으로 한 결론은 오답 판정. 롤아웃은 원인이 실려 들어온 통로일 뿐이고 트래픽은 배경이다.

  롤아웃 전후로 그 대상의 실행 조건에서 무엇이 달라졌는지, 그리고 그 대상 프로세스 내부 런타임 지표가 창 안에서 어떤 시간 패턴(주기·동기화)으로 응답 지연과 맞물리는지를 실측으로 보여라.

  '
case-f11-r-v3-6366db31: '이전 조사 판정: 대상 지목은 맞지만 결론 형식과 등급이 오답 판정. 원인이 계측 밖 의존(외부 캐시·브로커·API 류)이면 그것은 causes 의 내부 대상이 아니라 external_causes 에 적고, 그 외부 실패가 처음 관측된 내부 서비스를 boundary_target 과 causes 양쪽에 둔다. 외부 의존의 내부 상태는 직접 관측할 수 없으므로 status 는 provisional 까지만 준다 — confirmed 는 직접 인과 관측이 있을 때만이다.'
case-f11-r-v3-85b9a489: '이전 조사 판정: 대상 지목은 맞지만 결론 형식과 등급이 오답 판정. 원인이 계측 밖 의존(외부 캐시·브로커·API 류)이면 그것은 causes 의 내부 대상이 아니라 external_causes 에 적고, 그 외부 실패가 처음 관측된 내부 서비스를 boundary_target 과 causes 양쪽에 둔다. 외부 의존의 내부 상태는 직접 관측할 수 없으므로 status 는 provisional 까지만 준다 — confirmed 는 직접 인과 관측이 있을 때만이다.'
case-f14-p-v3-0bdb303b: '이전 조사 판정: DB 측 대상 지목은 맞지만 결론이 불완전하다는 판정 — 발원지가 하나라는 가정이 오답이다. 그 DB 오류를 받은 소비 측 내부 서비스가 실패를 어떻게 처리했는지(재시도·롤백·오프셋 커밋·예외 삼킴)를 그 서비스의 로그와 처리 결과 부재로 확인하라. 오류를 삼켜 결과를 영구 유실시킨 내부 서비스가 있으면 그것도 발원지이므로 causes 에 함께 적어라.'
case-f15-g-v3-fbe95718: '이전 조사 판정: 지목한 대상과 기전은 맞지만 결론이 불완전하다는 판정 — 발원지가 하나라는 가정이 오답이다. seed 의 영향 서비스가 걸친 도메인별로, 그 지목한 발원지의 전파 경로에 속하지 않는 영향이 남아 있는지 확인하라. 남아 있으면 그 도메인 안에서 같은 방법(잠금·대기 세션·느린 쿼리 실측)으로 두 번째 발원지를 찾아 causes 에 함께 적어라.'
