case-f19-p-v3-5a350c0a: '이전 조사 판정: food-delivery-dispatch 의 GET /api/deliveries COUNT 풀스캔을 원인에 포함한 결론은 오답 판정. 그 지연은 부하 아래 함께 나타난 배경이며 사용자 영향(결제·주문) 경로와 다르다.

  발원지는 하나다. 사용자 영향 경로에서 실패·지연을 처음 만든 지점만 원인으로 적고, 나머지는 결과나 배경으로 정리하라.

