# 교사 3차 힌트 ① (2026-09-23). r1/r2/status2 의 채택 힌트를 캡처 id 별로 재사용. 정답 단어 비노출. 라이브 프롬프트 전용 — 기록·학습 프롬프트에 안 들어감.
case-f04-r-v3-c508c52d: '이전 조사 판정: commerce-gateway/k6 부하, commerce-inventory 재고 예약 409, commerce-cart 낙관적 잠금 실패를 원인으로 지목한 결론은 오답 판정. 부하를 추종해 함께 오르내린 지표는 배경이며 원인이 아니다.

  이번 창의 장애는 그 셋과 무관한 곳에서 시작됐다. 동기 요청 경로가 아니라 비동기 경로(이벤트 발행·소비)의 정상 여부를 각 단계별로 직접 실측하라.

  '
case-f05-r-v3-527f3692: '이전 조사 판정: commerce-payment 의 배포 롤아웃·롤백 반복과 긴 기동 시간 자체를 원인 기전으로 한 결론은 오답 판정. 롤아웃은 원인이 실려 들어온 통로이고, 반복 교체는 결과다.

  파드가 왜 반복해서 종료됐는지 — 각 종료의 직접 사유를 실측으로 밝히고, 그 사유를 만든 조건이 롤아웃 전후로 어떻게 달라졌는지 보여라.

  '
case-f07-h-v3-7de1a36f: '이전 조사 판정: commerce-cart 커넥션 풀 포화를 원인으로 지목한 결론은 오답 판정. cart 의 포화는 같은 부하 아래 함께 나타난 전파 지점이지 발원지가 아니다.

  발원지는 하나다. 요청 흐름에서 그 하나의 대상이 왜 먼저 막히는지(그 대상 안에서 요청이 얼마나 오래 무엇을 붙들고 있는지)를 실측으로 보이고, 나머지는 결과로 정리하라. 확정 등급은 그 대상의 한도와 실측 도달을 직접 관측했을 때만 준다.

  '
