# mcp-v1q (SFT 9차-B, 사용자 2026-10-02 "응 3안으로 둘 다 돌려줘"): MLP 포함(attention qkvo + MLP gate/up/down) + 표준 LoRA, lr 1e-5, 400 스텝, 50 스텝 저장, 데이터 v8.
# 학습 로더 수정(2026-10-02): compressed-tensors 입력 활성값 가짜 양자화를 끄고(disable_quantization) 그래디언트 흐름 가드 통과 후 학습 — 이전 SFT/RL 은 기본 Linear 입력에서 그래디언트가 끊긴 상태였다.
# 목적: 수정된 그래디언트에서 용량(MLP) 효과 측정. 과적합 위험 → 체크포인트별 다음 행동 일치율로 선별. KT GPU1.
