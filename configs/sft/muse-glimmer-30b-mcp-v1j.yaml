# mcp-v1j: v1h 레시피 그대로(LoRA-FA, lr 1e-5, max_steps 200 코사인→0, 추론 가중 1.0) + 데이터 v5.
# v5 = 교사 3차(새 rca-mcp: sample_logs volume_shift · tools/list 순서 결정성 · get_k8s_state owner 핸들, 폭풍 억제 seed)
#      블라인드 teacher-v3 + 힌트 ① teacher-v3h 채택분만, 케이스당 ≤2 → 44 에피소드 / 26 케이스. 구 도구 궤적(v4 이하) 불포함.
# 등급 불일치 에피소드는 마지막 submit 턴만 손실 제외. 추론은 Claude 작성 + judge 통과 턴만 감독.
# mcp-v1j: v1g 안정화 레시피(LoRA-FA, lr 1e-5, max_steps 200 코사인→0, 누적 스케일 수정) + 데이터 v3.
# v3 = Claude 가 고정 호출을 알고 쓴 추론 + LLM 판정 통과 턴만 감독(1377/1383). 추론 가중 1.0.
# v2 vs v3 비교는 생략(사용자 결정) — 추론 궤적의 출처·품질이 정답 여부보다 중요하다는 문헌 근거로 v3 채택.
# mcp-v1j: v1c 레시피(데이터 v2, 학생 추론 가중 1.0, lr 1e-5, attention LoRA) + 진단 결과 반영.
# mcp-v1j: v1d 발산 시 대체 — lr 1e-5, clip 0.5, attention 투영만. 데이터 v2.
# mcp-v1: 첫 rca-mcp 표면 SFT. 학생 자기 궤적(정답·status 일치·ref 유효) 케이스당 ≤3개, 핸들(T<n>) 표기.
