# 베이스 모델은 실험으로 고른다. 여기 한 줄만 바꾸면 된다.
model_name: Qwen/Qwen3-8B
dataset: data/processed/sft_v0.jsonl        # REPO_ROOT 기준 상대경로
output_dir: outputs/sft/qwen3-8b-v0
max_length: 4096
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  bf16: true
  gradient_checkpointing: true
  report_to: none
