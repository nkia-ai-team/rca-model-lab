# mcp-v1n (SFT 8차, 사용자 2026-10-02 "C로하자"): 2026-10-02 진단 반영 — v1l/v1m 은 800 예제(데이터 0.8회)·lr 1e-5·attention B 만이라
# 학습 손실·vLLM NLL·다음 행동 일치율 모두 base 와 같았다(학습 무효). 단일 예제 과적합에서 attention 만은 폭주 후 회복 못 하고(3.17),
# MLP 포함은 폭주 후 회복해 0.25(1e-4)/0.03(3e-4). 그래서: MLP 포함 + A 학습(LoRA-FA 끔) + lr 2e-5 + 800 스텝(v8 1075턴 ≈ 3회) + 50 스텝 저장.
# 손실 급등에도 중단하지 않는다(과거 v1d 는 step 125 상승 때 수동 중단 — 회복 여부 미확인). 체크포인트는 다음 행동 일치율로 1차 선별.
# 데이터 v8 = 49 에피소드 / 27 케이스 (v1m 과 동일). 모델·토크나이저 계약은 v45 와 동일.
