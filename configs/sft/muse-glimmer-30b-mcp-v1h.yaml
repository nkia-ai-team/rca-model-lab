# mcp-v1h: v1g 안정화 레시피(LoRA-FA, lr 1e-5, max_steps 200 코사인→0, 누적 스케일 수정) + 데이터 v3.
# v3 = Claude 가 고정 호출을 알고 쓴 추론 + LLM 판정 통과 턴만 감독(1377/1383). 추론 가중 1.0.
# v2 vs v3 비교는 생략(사용자 결정) — 추론 궤적의 출처·품질이 정답 여부보다 중요하다는 문헌 근거로 v3 채택.
# mcp-v1h: v1c 레시피(데이터 v2, 학생 추론 가중 1.0, lr 1e-5, attention LoRA) + 진단 결과 반영.
# mcp-v1h: v1d 발산 시 대체 — lr 1e-5, clip 0.5, attention 투영만. 데이터 v2.
# mcp-v1: 첫 rca-mcp 표면 SFT. 학생 자기 궤적(정답·status 일치·ref 유효) 케이스당 ≤3개, 핸들(T<n>) 표기.
# 모델·토크나이저 계약은 v45 와 동일 (fp8-block 원본 dequantize, LoRA fp32, 옵티마이저 fp32 마스터).
