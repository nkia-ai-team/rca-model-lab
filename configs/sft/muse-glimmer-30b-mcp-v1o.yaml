# mcp-v1o (SFT 8차 재기동, 사용자 2026-10-02 "응 원인 확정되면 빼야하지않을까"): v1n 레시피에서 q_proj/k_proj 만 LoRA 대상에서 뺐다.
# 근거(2026-10-02 탐침, 스크래치 parity/probe*.log): 단일 예제 과적합의 손실 폭주는 활성값·logit 포화가 아니라 attention 엔트로피 붕괴 —
# q_proj 변화량이 가장 크게 자라며 최소 헤드 엔트로피 0.10→0.004, 폭주 순간 k/q 그래디언트 폭발. q/k 제외 효과는 probe2 결과로 확인 후 기동.
# 나머지는 v1n 과 동일: v/o + MLP, 표준 LoRA(A 학습), lr 2e-5, 800 스텝(v8 ≈ 3회), 50 스텝 저장, 손실 급등에도 중단 안 함.
