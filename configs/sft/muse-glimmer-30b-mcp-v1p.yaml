# mcp-v1p (SFT 9차-A, 사용자 2026-10-02 "응 3안으로 둘 다 돌려줘"): v1m 레시피 그대로(attention LoRA-FA, lr 1e-5, 200 스텝, 데이터 v8) — 바뀐 것은 로더뿐.
# 학습 로더 수정(2026-10-02): compressed-tensors 입력 활성값 가짜 양자화를 끄고(disable_quantization) 그래디언트 흐름 가드 통과 후 학습 — 이전 SFT/RL 은 기본 Linear 입력에서 그래디언트가 끊긴 상태였다.
# 목적: 수정 효과만 분리해 측정. KT GPU0.
