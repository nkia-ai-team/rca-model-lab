# mcp-v1f: v1c 절제 실험 — 데이터 v2, lr 1e-5, clip 0.5, attention LoRA 전부 동일, **추론 토큰 손실 가중 0**.
# v1c(가중 1.0, 학생 추론)는 90 정점 후 261 발산, v1e(v3 Claude 추론, 가중 0.3)는 60 부터 베이스 이하·130 발산.
# 다섯 런 모두 발산 → 추론 감독이 원인인지 트레이너인지 가르는 실험. save_steps 30.
# mcp-v1f: v1d 발산 시 대체 — lr 1e-5, clip 0.5, attention 투영만. 데이터 v2.
# mcp-v1b: lr 2e-5 (v1 은 5e-5 에서 step 36~69 CE 0.41→0.54·grad 0.15→1.3 상승). 나머지 동일.
# mcp-v1: 첫 rca-mcp 표면 SFT. 학생 자기 궤적(정답·status 일치·ref 유효) 케이스당 ≤3개, 핸들(T<n>) 표기.
# 모델·토크나이저 계약은 v45 와 동일 (fp8-block 원본 dequantize, LoRA fp32, 옵티마이저 fp32 마스터).
