# mcp-v1e: 데이터 v3 — 추론을 Claude 가 고정 호출을 알고 작성(rationale_writer) + LLM 판정 통과 턴만 감독.
# v1~v1d 가 전부 발산한 원인은 lr 이 아니라 데이터였다: 같은 학습 데이터에서 추론 NLL 0.526→0.803(상승),
# 호출 NLL 0.268→0.223(하락) — 비정합 추론과 행동이 반대로 당겨 결국 그래디언트가 터졌다(발산 step 78@5e-5,
# 125@2e-5, 261@1e-5 로 lr 에 반비례). 레시피는 v1c 와 동일(lr 1e-5, clip 0.5, attention LoRA), save_steps 60.
# mcp-v1e: v1d 발산 시 대체 — lr 1e-5, clip 0.5, attention 투영만. 데이터 v2.
# mcp-v1b: lr 2e-5 (v1 은 5e-5 에서 step 36~69 CE 0.41→0.54·grad 0.15→1.3 상승). 나머지 동일.
# mcp-v1: 첫 rca-mcp 표면 SFT. 학생 자기 궤적(정답·status 일치·ref 유효) 케이스당 ≤3개, 핸들(T<n>) 표기.
# 모델·토크나이저 계약은 v45 와 동일 (fp8-block 원본 dequantize, LoRA fp32, 옵티마이저 fp32 마스터).
name: muse-glimmer-30b-mcp-v1e
model_name: /home/work/models/muse-glimmer-30b-fp8-block
tokenizer_name: models/muse-glimmer-30b-tokenizer
checkpoint_format: compressed_tensors_fp8_block
model_revision: 8ed2e29141d4fef439b9a0e15e0a2678bc190a82
model_config_sha256: 5f1476af88c0462bc448f05b36eaa4c2fae3bbe3cfafc2f281c7bf452958b8f8
model_index_sha256: 22970c4e6b652245647b907d908147798d49e316623f43d1c611b1a12c79ba2d
tokenizer_sha256: 399ef208c3f43075d950340f15ef628a409062e872202170620b4fb2323e68a2
training_compute_dtype: bfloat16
adapter_parameter_dtype: float32
optimizer_state_dtype: float32
dequantize_for_training: true
dataset: data/processed/mcp-sft-v3.jsonl
dataset_sha256: "9d0b451d43923ba53a9a96914e662cad8c3557598d1b420bf851993bbd8e8d34"
expected_examples: 42
expected_cases: 22
output_dir: /home/work/models/rca-adapters/muse-glimmer-30b-mcp-v1e
max_length: 52000   # 49152 window + final forced-answer turn margin; RoPE covers it
epochs: 2
learning_rate: 1.0e-05
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_grad_norm: 0.5
batch_size: 1
gradient_accumulation_steps: 4
save_total_limit: 10
save_steps: 60
reasoning_strength: null
case_balanced_loss: true
reasoning_loss_weight: 0.3   # Claude 작성 추론은 학생 분포 밖(추론 NLL 1.93 vs 자기 텍스트 0.40); 호출 토큰은 1.0 유지
use_liger_kernel: false
supervise_end_token: false
sequence_mode: turns
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: '.*language_model.*self_attn\.(q_proj|k_proj|v_proj|o_proj)'   # regex: language model only (all-linear also wrapped the vision tower; vLLM refuses those targets)
wandb:
  entity: nkia-ai
  project: rca-actor-sft
  version: mcp-v1e
