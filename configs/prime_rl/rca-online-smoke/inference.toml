# Standalone Prime vLLM process on server 104, physical GPU 2.
# Pin the process with CUDA_VISIBLE_DEVICES=2 at launch time.
output_dir = "/home/swlee/projects/prime-rl-rca/outputs/rca-online-smoke-inference"
backend_port = 8100

[server]
host = "127.0.0.1"
port = 8000
liveness_timeout_seconds = 60.0

[weight_broadcast]
type = "filesystem"

[vllm]
# Intentionally omitted. Supply --vllm.model with the path reported by the
# model-download owner; this config must not guess a server-104 destination.
tokenizer = "/home/swlee/projects/rca-model-lab/models/muse-glimmer-30b-tokenizer"
served_model_name = ["rca-actor"]
dtype = "auto"
max_model_len = 32768
gpu_memory_utilization = 0.95
max_num_seqs = 8
max_num_batched_tokens = 16384
attention_backend = "FLASH_ATTN"
kernel_config = { enable_flashinfer_autotune = false }
enable_chunked_prefill = true
enable_prefix_caching = true
language_model_only = true
disable_log_stats = false
enable_lora = true
max_loras = 1
max_lora_rank = 8
lora_target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "up_proj",
  "down_proj",
  "gate_proj",
]
structured_outputs_config = { backend = "guidance", disable_any_whitespace = true }
