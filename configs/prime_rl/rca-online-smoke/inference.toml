# Standalone vLLM process on the KT inference H200.
output_dir = "/home/work/prime-rl-rca/outputs/rca-online-smoke-inference"
backend_port = 8100

[server]
host = "127.0.0.1"
port = 8000
liveness_timeout_seconds = 60.0

[weight_broadcast]
type = "filesystem"

[vllm]
model = "/home/work/models/muse-glimmer-30b-fp8-block"
tokenizer = "/home/work/rca-model-lab/models/muse-glimmer-30b-tokenizer"
served_model_name = ["rca-actor"]
dtype = "auto"
max_model_len = 32768
gpu_memory_utilization = 0.95
max_num_seqs = 8
max_num_batched_tokens = 16384
attention_backend = "FLASH_ATTN"
kernel_config = { enable_flashinfer_autotune = false }
enable_chunked_prefill = true
enable_prefix_caching = true
language_model_only = true
disable_log_stats = false
enable_lora = true
max_loras = 1
max_lora_rank = 8
lora_target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "up_proj",
  "down_proj",
  "gate_proj",
]
structured_outputs_config = { backend = "guidance" }
