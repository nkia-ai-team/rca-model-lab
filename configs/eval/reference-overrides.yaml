  case-f04-r-v3-c508c52d:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: shipping consumer scaled to zero — orders keep being accepted but no shipments are created (concurrent load rejects some checkouts for stock)
    cause: 'The testbed-shipping Deployment is scaled from 1 to 0 replicas at injection start (ScalingReplicaSet 1→0; the only pod receives a graceful SIGTERM stop,
      not a crash or OOM) and is scaled back to 1 about 8 minutes later → for those ~8 minutes the shipping-service consumer group on commerce.orders has no member,
      so OrderEventConsumer receives no PAID events, ShippingService.createShipmentForOrder is never called, no shipment rows are inserted and the shipping outbox
      stops publishing, while commerce-order keeps publishing to commerce.orders and the other consumer group on the same topic (notification-service) keeps consuming
      normally → when the consumer returns it reports the accumulated backlog (lag ~1.3-1.7k per partition) and drains it in a burst of late shipment inserts. The
      observable signature during the gap is the absence of the consumer (no consumer spans, logs or metrics) plus desired_replicas = 0, not a rising lag series.
      Required for mechanism 1: commerce-shipping''s consumer is absent because the deployment was scaled to zero or the pod was deliberately stopped and not replaced
      (a deliberate/graceful stop with crash and OOM ruled out is equivalent), so orders stop turning into shipments while the order path keeps accepting orders.
      A conclusion that leaves the disappearance unexplained, or calls it a crash, misses the trigger. Not part of this mechanism: during the window a load surge
      runs against the commerce gateway; inventory stock is exhausted faster than the per-minute restock, so about 40% of checkouts are rejected with 409, and commerce-cart
      returns a handful of optimistic-lock 500s. Describing these as concurrent load effects is fine; blaming them as the root misses the case.'
    evidence: 'kcm_events ''Scaled down replica set testbed-shipping-68f6c6f697 to 0 from 1'' at +7 s, scaled up at +486 s; desired_replicas 0 from +3 s to +423 s;

      shipping consumer spans 0 for +1..+8 min, INSERT shipments burst 414/982 at +9/+10 min; reserve 409 x414 (39%), ''Restocked ... +60 -> 60'' every minute.

      '
  case-f07-h-v3-7de1a36f:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: ingress surge exceeds commerce-order's pool-10 checkout knee (and, in parallel, commerce-cart's CPU/pool limit)
    cause: 'The only change is a north-south ingress surge at the commerce gateway (about 11x) → commerce-order''s checkout runs its synchronous saga (cart read,
      pricing quote, product/inventory reserve, payment, cart delete) inside one transaction, so each request holds a pooled DB connection for the sum of those calls
      → order''s default Hikari pool (max 10) reaches used=10/idle=0 within ~1.5-2.5 min with 100-180 requests pending (PostgreSQL idle-in-transaction sessions rise
      from 0 to ~16-29) → checkout requests wait 2-8 s for a connection before their first downstream call, so checkout and gateway POST /api/orders p95 rise to ~4-4.8
      s; the order path itself returns no 5xx and no pool timeouts (its error responses are business 4xx: 409 when inventory stock is exhausted, 400 for empty carts).
      Under the same surge commerce-cart reaches its own capacity limit in parallel: its JVM CPU pegs near 100%, its Hikari pool (max 20) is exhausted ~20 s after
      order''s, and ~2k 3-second connection-acquisition timeouts plus optimistic-lock and duplicate-key conflicts (writes concentrated on a few carts) return HTTP
      500 on POST/DELETE /api/carts — all of the 5xx. Cart''s write traffic comes mostly straight from the gateway, so it is a parallel, load-induced bottleneck,
      not a propagation hop of order. No configuration, deployment or resource change; DB blocking is ~0; everything recovers when the load stops. Required for mechanism
      1: the load surge as trigger, and order''s pool-10 exhaustion because checkout holds its connection across the downstream calls, with connection waits driving
      checkout latency. Describing commerce-cart''s parallel CPU/pool saturation and its 500s is correct and is not penalized (commerce-cart is an allowed extra target
      in the golden); a conclusion that names only cart misses the injected root.'
    evidence: 'order pool used=10 sustained from +138 s (pending 149-180), checkout start→first child gap p50 1.6-3.2 s; cart CPU ~1.0 from +167 s, pool 20 exhausted
      at

      +157 s, 1,989 Hikari timeouts, cart 500 x449 = all 5xx; order 0 5xx; checkout 409 x791, 400 x603.

      '
