    title: user-service readiness failure → gateway auth fail-close, writes-only 401 (reads normal)
    cause: 'The testbed-user Deployment''s readinessProbe is patched to a path the application does not serve; with a single replica and maxSurge 0 the old pod is
      removed first, the new pod needs ~55 s to start, and once the application is up its readiness probe keeps failing with HTTP 404, so the pod never becomes Ready
      and the testbed-user Service has no endpoints → every gateway call to user-service gets connection refused and the gateway''s user circuit breaker opens → login/signup
      proxied through the gateway (POST /api/users/**) fail with 502, and write requests that need token verification fail — mostly 401 returned by the gateway without
      reaching user-service, with some verify-token attempts surfacing as 500 (connection refused) — while reads (product/cart GETs) stay normal and downstream domain
      services receive almost no writes. The cleanup rollout back to the original probe adds another start-up gap before recovery. Required for mechanism 1: the failing
      readiness probe (pointed at a non-existent path / 404) as the trigger, and the resulting loss of ready endpoints / user-service unreachability as the failure
      mode, with gateway auth/login failures as impact. A conclusion that blames only a rollout start-up gap (slow JVM start, missing surge capacity) without the
      failing readiness probe misses the key element. Describing the gateway symptom as 502 (login) or 401/500 (writes) is acceptable; whether the 401s come from
      fail-close or from clients without a token is not required (the capture does not distinguish them).'
    evidence: '''Readiness probe failed: HTTP probe failed with statuscode: 404'' x11 at +62..+152 s after ''Started UserServiceApplication'' at +55 s; gateway

      POST /api/users/** 324/328 = 502, ''user'' OPEN 8,585; POST carts 87 x 401 with no verify call; 24 verify-token Connection refused → 500.

      '
