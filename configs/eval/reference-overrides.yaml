# Grader-side corrections to a capture's reference cause (the meta.json text the mechanism judge and the
# hint writer compare against). /data/eval-cases is read-only, so corrections live here. Each entry keeps the
# evidence that justified it; `version` is stored in every judge cache entry so a corrected reference is never
# graded with a verdict made against the old text. Golden root target ids are NOT changed here
# (see configs/eval/train-family-v2.yaml for allowed_target_ids / expected_status).
# 2026-10-01: f20-r (two passes) + 18 training captures from the reference audit (scratchpad ref-audit/report_[A-E].md).
cases:
  case-f20-r-v3-caf04820:
    version: override-2026-10-01b
    decided: 2026-10-01 user — (a) adopt the capture-observed OOM path ("응 진행해"); (b) first required both queries, then, after the capture showed the search requests
      were mostly rejected (42P18), the stats query is the required trigger and the search is a minor, mostly-failed contributor ("응 B로 가자").
    title: commerce order daily-stats full scans push the shared PostgreSQL over its memory limit (OOM restarts) — commerce-wide DB disconnects and stalls
    cause: 'Repeated GET /api/orders/stats/daily?days=90 (OrderRepository.dailyStats, FUNCTION(''DATE'') GROUP BY over order_schema.orders) is the trigger that must
      be named: these full scans run long under load → the single shared PostgreSQL instance, already near its 512Mi memory limit (~88% used before the load), exceeds
      the limit within ~20 s (parallel full scans / aggregation) → postgres is OOM-killed three times and restarts with CrashLoopBackOff → every commerce service
      loses its DB connections (SQLSTATE 08006) and order / payment / inventory requests stall or time out (gateway read timeouts on /api/orders/stats/daily) → PostgreSQL
      CPU rises only after the restarts, during recovery. The unbounded GET /api/orders search was part of the load, but most of its executions were rejected at once
      with SQLSTATE 42P18 (could not determine data type of parameter), so it is at most a minor contributor: mentioning it as failed or minor is fine, but a conclusion
      that blames the search alone and leaves out the daily-stats query misses the key element.'
    evidence: 'Load start 03:25:19Z. syslog "postgres invoked oom-killer" at +20 s, +44 s, +96 s; k8s events: container started

      +22 s, BackOff +45 s, started +56 s, BackOff +96/+108 s, started +120 s. Postgres container memory 449 MB / 512 MiB

      limit in the 10 min before the load. Container CPU (60 s points): 24 m at +41 s, 932-984 m from +101 s to +281 s

      (after the load ended at +96 s), 28 m at +401 s. ~300 DB-disconnect log lines (commerce-order, gateway, product,

      user) between +0 s and +180 s; 65 gateway read timeouts on /api/orders/stats/daily between +30 s and +90 s.

      Search: commerce-order logs 66 x "SQLState: 42P18", postgres log 22 x "could not determine data type of parameter

      $5"; the two search traces before the first OOM ended in 20 ms and 81 ms with errors, one later search ran 14.5 s;

      32 gateway read timeouts on GET /api/orders. The meta.json text ("CPU rise → payment/inventory latency only, no

      5xx") does not mention the OOM restarts.

      '
  case-f03-h-v3-d4192a3b:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: order servlet thread pool exhaustion — a serialized report renderer sets the throughput ceiling
    cause: 'Repeated long-range report requests (GET /api/orders/reports/render with a large days range, from a load generator) reach commerce-order, where report
      rendering runs on the request thread and is serialized on one lock (render() is synchronized) and each long-range render is expensive → renders complete one
      at a time at a fixed ceiling (~2/s) while arriving requests queue on the lock: ~199 Tomcat worker threads sit BLOCKED (none at baseline) while RUNNABLE threads
      stay at baseline, so the 200-thread servlet worker pool is exhausted → every request sharing the pool starves: the /actuator/health probes time out and the
      kubelet restarts the order container on failed liveness probes (two restarts, each followed by ~1 min of startup with no service), and checkout requests wait
      or are refused, the gateway''s circuit breaker for order opens and most POST /api/orders/** return 502 (some 15 s read timeouts). The DB connection pool (at
      most 5 of 10 used, none pending), PostgreSQL locks (0 blocked), downstream pricing/inventory/payment latency and node CPU stay healthy; the order JVM''s single
      CPU (container limit 500m) is pinned near 100% throughout, which is expected because one render is always running. Required for mechanism 1: (a) the long-range
      report render requests on commerce-order as the trigger; (b) rendering serialized on one lock/monitor — equivalently requests waiting BLOCKED on a shared monitor
      rather than running; (c) servlet worker-pool exhaustion that starves checkout (and health checks). The liveness restarts and the gateway circuit breaker may
      be named but are not required. Naming CPU saturation or many threads time-sharing a CPU quota as the failure mode instead of the serialization contradicts the
      BLOCKED-vs-RUNNABLE thread data and misses the key element (mentioning CPU at its limit alongside the serialization is fine). The quadratic render cost and
      the reused-buffer reason are not observable and not required.'
    evidence: '289 render SERVER spans on commerce-order, 0 before t1; completions capped ~60-63 per 30 s; jvm.thread.count{state=blocked} 199 from +12 s (no series
      at

      baseline), RUNNABLE 10-16; liveness kills at +79 s and later (startups 62 s); gateway POST /api/orders/** 527/562 = 502; Hikari used <=5/10; 0 PG blocked.

      '
  case-f05-r-v3-527f3692:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: payment memory limit reduction — memcg OOM kills and restarts under payment load
    cause: 'The commerce-payment deployment is rolled out with the JVM heap pinned (JAVA_TOOL_OPTIONS adds -Xms384m -Xmx384m -XX:+AlwaysPreTouch; heap max 384 MiB
      vs 256 MiB at baseline) and its container memory limit lowered from 1Gi to 640Mi → with the pinned, pre-touched heap plus non-heap memory the JVM''s resident
      memory sits just below 640Mi and reaches the limit under checkout load → the kernel memcg OOM killer kills the payment java process twice (anon-rss ~651 MB,
      memcg usage = the 640Mi limit, visible in node syslog; the Kubernetes OOMKilled termination reason is not recorded in this capture) → the single payment replica
      restarts and needs ~45 s to boot, so no payment endpoint is ready → commerce-order''s payment calls get Connection refused, @CircuitBreaker(paymentClient) opens
      and checkout returns 502 → the cleanup rollouts (limit back to 1Gi, then flags removed) end the kills. Required for mechanism 1: the reduced container memory
      limit on commerce-payment, and memory reaching that limit → OOM kills → restarts. The heap pinning may be named but is not required. Naming the repeated rollouts,
      slow boots, startup-probe failures or CPU at the 500m limit during boot as the failure mode instead of the memory limit / OOM kill misses the key element (these
      occur in every pod generation, including pods that never died); seeing the OOM kills while saying the limit was unchanged misses the trigger.'
    evidence: 'RS 58c445c67 (rev 218) memory limit 640Mi (kcm.container.mem_limit 671088640 vs 1073741824 elsewhere); node syslog memcg OOM kills of the payment java

      process at +166-173 s and +265-272 s (anon-rss ~651 MB); no OOMKilled/BackOff in kcm_events; restart_count 0->1; order ''paymentClient'' OPEN 1,320x;

      checkout 502 = 133 in the window.

      '
  case-f01-p-v3-d691440c:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: banking Oracle settlement-account lock — a single row in another namespace blocks all commerce payments
    cause: 'A long-held transaction in the banking Oracle keeps the BANKING.accounts row ''commerce-settlement'' locked (every commerce payment shares this settlement
      account) → core-banking-transfer''s SELECT ... FOR UPDATE on that row (TransferService.execute / findByIdForUpdate) blocks on row-lock contention → the first
      payment→transfer calls hang until payment''s 10 s banking read timeout; within ~20 s the lock waiters hold every connection of transfer''s DB pool, transfer''s
      DB health check times out, its readiness probe fails and the transfer pod drops out of the Service endpoints, after which payment→transfer calls fail immediately
      with Connection refused → payment returns 502 (the external PG approval has already succeeded), order''s PaymentClient counts the 5xx, @CircuitBreaker(paymentClient)
      opens and every checkout fails with 502 until the lock is released. Commerce PostgreSQL has no blocked sessions. The transfer pod is never deleted, scaled down
      or crash-restarted; it goes NotReady only because its DB health check times out. Required for mechanism 1: the long-held row lock on the shared settlement account
      in the banking Oracle as the trigger, transfer''s FOR UPDATE blocking on it as the failure mode, and propagation to payment/checkout failures. Whether the payment-side
      failures are described as 10 s timeouts or as connection refusals after transfer''s pool exhaustion / NotReady is not decisive.'
    evidence: 'Oracle ''enq: TX - row lock contention'' sessions from the transfer pod (128 rows, +58..+492 s); 2 payment→transfer 10 s timeouts at +7 s, then transfer

      Hikari exhausted at +24 s (148 lines), readiness failures from +24 s, available_replicas 1->0 from +52 s to +412 s, 33 Connection refused calls in 0-3 ms;

      checkout ~759 x 502.

      '
