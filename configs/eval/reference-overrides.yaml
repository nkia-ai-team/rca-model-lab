  case-f19-p-v3-5a350c0a:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: food external PG ~8 s delay (below timeout) briefly drains order's pool, while a load-induced dispatch pool collapse dominates the order failures
    cause: 'Two concurrent failures under the food surge load. (1) Injected: the external PG mock (testbed-external-pg-mock /pay) answers after ~8 s with HTTP 200,
      below payment''s 10 s read-timeout; food-delivery-payment passes the delay through as slow 200s with no errors (POST /api/payments ~8.1 s); food-delivery-order
      waits on the payment call while holding a DB connection inside its order transaction, so its Hikari pool (15) is exhausted for ~30 s at the start (3 s acquisition
      timeouts, at least one order 500) and the first orders succeed only after 8-19 s. (2) Load-induced, concurrent: the surge load drives GET /api/deliveries on
      food-delivery-dispatch, whose page COUNT query fully scans dispatches (~2.3M rows, ~0.7 s at baseline → ~8 s under load); dispatch''s Hikari pool (10) is saturated
      for the rest of the window (3 s acquisition timeouts, HTTP 500, health-check failures, restarts), order''s dispatch capacity check fails (500 / connection refused
      / CircuitBreaker ''dispatch'' OPEN), and almost all order requests return 503 "Dispatch service unavailable"; because those orders fail before the payment step,
      the PG delay is no longer exercised after the first minute. Required for mechanism 1: the external PG delay passed through payment as slow successful (non-error)
      responses, which held order''s connections/transactions and exhausted order''s pool. Naming the dispatch pool collapse as a concurrent load-induced cause of
      most order failures is correct and is not penalized (food-delivery-dispatch is an allowed extra target in the golden). A conclusion that names only the dispatch
      collapse and omits the PG delay misses the injected root; a conclusion that claims payment returned 5xx is wrong.'
    evidence: '8 traced /pay calls 8,002-8,007 ms with 200 (+19..+47 s), payment 0 errors; order pool 15/15 only +0/+30 s buckets, 31 Hikari lines +29..+60 s, one

      order 500 at +48 s; dispatch COUNT 7.6-8.0 s, pool 10/10 +30..+480 s, 2,110 Hikari timeouts from +41 s, restarts 3→5; orders 255 x 503 dispatch-unavailable.

      '
  case-f19-s-v3-5daa9c97:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: food external PG delay beyond the read-timeout — payment 502s and circuit opening reject orders, alongside a load-induced dispatch pool collapse
    cause: 'The external PG mock delays /pay far beyond payment''s 10 s read-timeout: each call ends with a ~10 s read timeout (SocketTimeoutException; the client
      logs it as a response-extraction / octet-stream error), with retries → payment returns 502, CircuitBreaker ''pg'' opens and later calls fail fast with 502 →
      food-delivery-order receives the 502s, opens its ''payment'' circuit and rejects orders with 502 (the first failure, from ~10 s after injection). Concurrently,
      the food surge load drives GET /api/deliveries on food-delivery-dispatch, whose page COUNT query fully scans dispatches (~2.3M rows, up to ~8-16 s); dispatch''s
      Hikari pool (10) saturates from ~45 s onward (3 s acquisition timeouts, 500s, health-check failures), and for the rest of the window most order requests fail
      with 503 "Dispatch service unavailable" (capacity-check failures / CircuitBreaker ''dispatch'' OPEN) while order''s own pool also times out sporadically. Required
      for mechanism 1: PG calls exceeding the read-timeout, converted by payment into 502 with the pg circuit opening, which caused order rejections. Naming the dispatch
      pool collapse as a concurrent load-induced cause of most later order failures is correct and is not penalized (food-delivery-dispatch is an allowed extra target
      in the golden). Describing the PG failure as timeouts and/or unparseable responses is acceptable.'
    evidence: 'every traced /pay 10,011 ms SocketTimeoutException; ''PG mock unavailable: CircuitBreaker pg is OPEN'' from +17 s; order ''payment'' OPEN 50x; 8 x
      502 orders

      mostly +10..+55 s; dispatch Hikari timeouts 2,270 from +46 s; orders 214 x 503 dispatch.

      '
  case-f18-p-v3-d2c566ad:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: transfer outbox relay switched off by its runtime control flag — transfers return 200 while ledger publishing silently stalls
    cause: 'The transfer service''s outbox relay is disabled at runtime through its control row (BANKING.outbox_relay_control, service_id=''transfer'', enabled=0),
      with no restart, rollout or env change → the @Scheduled relay keeps firing each cycle, reads the control row and returns without polling outbox_events, so polling,
      markPublished and Kafka publishing to banking.transfers / banking.ledger drop to zero (transfer producer send rate → 0) → transfers keep committing and inserting
      outbox rows with published_at null, so the unpublished backlog grows monotonically → the ledger consumer (ledger-service) receives nothing, ledger_entries inserts
      stop, and consumer lag stays at 0 (a starved consumer, not a stuck one), while the synchronous transfer API keeps returning 200 with normal latency → when the
      flag is re-enabled the backlog is published in a burst and the ledger catches up. Required for mechanism 1: the transfer-side outbox relay/publisher stopped
      publishing (relay disabled/gated by its control flag or configuration) while the synchronous path stays healthy, unpublished outbox rows accumulate, and the
      ledger is starved. Naming the DB control row/flag is correct; an env-var or bean-not-created explanation is not required. Notifications are not observable in
      this capture and are not required.'
    evidence: 'relay run → findById → SELECT outbox_relay_control every minute, polling/markPublished/publish spans 0 in +0..+8 min; producer send rate 1.5/s → 0,
      then

      backlog burst 24-27/s; ledger ''Received transfer event'' 0 for +1..+7 min; records_lag 0 throughout; POST /api/transfers 156 OK; meta injection_summary

      itself says the control-row UPDATE was used and the env toggle was not.

      '
