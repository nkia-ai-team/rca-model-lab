  case-f05-p-v3-6fe331ef:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: tb-w1 node memory exhaustion — host OOM kills and a node stall take down the commerce pods co-located on that node
    cause: 'A memory-hog process on worker node tb-w1 allocates ~6.25 GiB of anonymous memory within seconds → node memory is exhausted (used ~6.9 → 12.4 GB, free
      → <0.1 GB, page cache 3.2 → 0.25 GB; no swap) faster than kubelet eviction reacts → the kernel global OOM killer fires (SystemOOM) and kills co-located container
      processes — the commerce-cart JVM and the payment-provider mock — which restart in place → gateway calls to cart are refused and the cart circuit breaker opens,
      so cart and checkout requests fail with 5xx → continued memory pressure (page-cache reclaim thrash, host CPU ~100% mostly kernel, load ~150) stalls the node:
      probes of all tb-w1 pods time out, the PostgreSQL instance on tb-w1 slows so commerce services'' DB pools time out, a second OOM kill hits the node agent, and
      the node is NotReady for about a minute → everything recovers when the hog ends; no pod is evicted or rescheduled (taint-based deletions are cancelled). The
      blast radius is the node: the commerce services and the shared infra on tb-w1; services on other nodes stay healthy. It is not a container-limit or application
      defect (system OOM, not a cgroup limit). Required for mechanism 1: the memory hog on tb-w1 exhausting node memory (trigger), and node-level memory exhaustion
      killing and/or stalling the co-located workloads (host OOM kills of co-located containers, node stall, shared-DB slowdown) as the failure mode. Kubelet eviction
      did not occur in this capture and must not be required; a conclusion that names kubelet eviction as the mode is inaccurate but still identifies the node-memory
      mechanism.'
    evidence: 'python3 pid on tb-w1 RSS 6.56 GB from +2 s; SystemOOM (victims cart JVM, pg-mock JVM) at +6 s, in-place restarts; no Evicted/MemoryPressure events;

      NodeNotReady +151..+213 s; second SystemOOM (kcm-agent) at +201 s; TaintManagerEviction cancelled at +216 s; food/banking pods not on tb-w1, 0 errors.

      '
  case-f06-h-v3-e43298a2:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: commerce payments table EXCLUSIVE lock → all payments blocked, pods stay Ready
    cause: 'An in-cluster client session takes LOCK TABLE payment_schema.payments IN EXCLUSIVE MODE and then sits idle in transaction for ~8 minutes → every INSERT
      into payments from PaymentService.processPayment queues behind the lock (10-12 blocked sessions, all from the payment service) → order''s payment calls stall,
      order''s paymentClient circuit breaker opens within ~20 s and requestPaymentFallback returns 502 for essentially all checkouts (reserved stock is released)
      → because the blocked INSERTs hold all 10 of payment''s Hikari connections, payment''s DataSource health check cannot get a connection (30 s timeout), so its
      readiness and liveness probes fail and the container is restarted (each restart''s startup CREATE INDEX on payments also queues behind the lock); order then
      also gets connection-refused errors → everything recovers right after the locking session ends. Required for mechanism 1: a long-held table lock on payment_schema.payments
      (EXCLUSIVE mode, idle-in-transaction holder) blocking the payment INSERTs, and the resulting payment failure reaching checkout through order''s circuit breaker
      / 502. Plain SELECTs are not blocked by this lock mode, but here health checks still fail because the pool is exhausted; describing either the read-timeout/circuit-breaker
      path or the pool-exhaustion/health-failure/restart path is consistent with the capture.'
    evidence: 'root pid 97262 idle in transaction (tranTime 16.8 s → 443.8 s) blocking 10-12 payment sessions; order ''paymentClient'' OPEN from +22.6 s; payment
      Hikari

      ''total=10, active=10'' at +41.8 s, DataSource health check 30011 ms at +44.3 s; liveness kill at +87 s, restarts; checkout 502 98-100%.

      '
  case-f09-h-v3-0c795f2b:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: order JVM GC pressure (heap shrink)
    cause: 'A rollout of commerce-order restarts its JVM with the heap capped far below its previous size (about 96 MiB total versus about 256 MiB; old generation
      about 67 MB versus about 179 MB, Eden about 27 MB versus about 72 MB; only commerce-order changes) → under the parallel checkout load the old generation fills
      to about 93-96% of its new limit within about 90 s and stays there, young collections become more frequent, and the single-vCPU JVM runs near its 500m container
      CPU limit → stop-the-world GC pauses stall the whole order process (this step is inferred: no GC-pause metric is collected, but the heap-limit cut, the near-full
      old generation, a class-unloading full GC and elevated JVM CPU support it) → intermittent tail latency on every order entry point (checkout p95 about 2x baseline,
      maxima of a few hundred ms, p50 flat; consumer spans affected alike), with no OOMKill and no restart. Required for mechanism 1: the order JVM heap cap / shrink
      as the trigger, and GC pressure from too little heap as the failure mode. The multi-second spikes right after each new pod becomes ready (the rollback pod included)
      are JVM cold start and are not required. The traffic increase is the test load, a condition, not the cause.'
    evidence: 'jvm.memory.limit per pool: new pod s9wfx Tenured 67,108,864 / Eden 26,869,760 / Survivor 3,342,336 vs 178,978,816 / 71,630,848 / 8,912,896 on old and

      rollback pods; Tenured used 93-96% from +84 s; no jvm.gc.* series collected; rollback pod shows the same cold-start spikes with the normal heap.

      '
  case-f10-h-v3-4fe69be0:
    version: override-2026-10-01-audit
    decided: 2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해")
    title: MySQL PVC backing-disk IO saturation — food orders slow down while holding connections
    cause: 'Two stressors hit the single food-delivery MySQL (testbed-mysql-0 on tb-w3) for the same ~4.5 minutes. (1) Required trigger: a fio random-write job (4k,
      direct I/O, iodepth 16, 20000 IOPS) writes into the local-path PVC directory of mysqldata-testbed-mysql-0 on tb-w3 and saturates the node''s disk (busy ~3%
      → ~86-89%, iowait ~0.7% → ~17%, node disk-pressure condition) → InnoDB redo-log and data-file writes stall (redo write latency up ~50-100x), so COMMIT and write
      statements slow down (COMMIT ~1 ms → 8-15 ms; order inserts take tens of ms). InnoDB buffer-pool misses are not observed (hit ratio ≥99.99%). (2) At the same
      time the food entry test load multiplies calls to food-delivery-dispatch''s GET /api/deliveries, whose paging COUNT over dispatches cannot use an index ((?
      IS NULL OR status = ?), ~2.2M rows examined, ~0.6 s even at baseline); the COUNT runs ~8x more often and, with ~5x overall query volume, drives the MySQL container
      to its 500m CPU limit (heavy CPU throttling), so every statement stalls (the COUNT grows to ~8 s, trivial restaurant statements gain ~50 ms), the slow COUNTs
      hold dispatch''s 10-connection Hikari pool until it is exhausted, dispatch requests fail with 500 after the 3 s connection timeout and its health probes time
      out, and food-delivery-order order creation fails through its dispatch calls (most POST /api/orders error) while restaurant reads slow 15-25x without errors.
      Required for mechanism 1: the fio disk saturation of the MySQL PVC on tb-w3 slowing MySQL. Describing the dispatch pool exhaustion through the full-scan COUNT
      and the MySQL CPU limit as an additional, parallel path is consistent with the data and is not penalized (food-delivery-dispatch is an allowed extra target
      in the golden); a conclusion that names only the dispatch query or the load, with no disk saturation, misses the required trigger.'
    evidence: 'fio on tb-w3 writing 60-73 MB/s (+23..+203 s); vda busy 0.82-0.86, cpu.wait 17%; NodeHasDiskPressure +11..+318 s; redo write latency x50-100, COMMIT

      1 → 7.6-15.5 ms; buffer-pool hit 99.99-100%; MySQL container throttled 34-62 s per sample; dispatch COUNT 67-77/min at ~8 s; dispatch Hikari timeouts 584;

      POST /api/orders 65/81 errored.

      '
  case-f11-r-v3-6366db31:
    version: override-2026-10-01-audit
    decided: '2026-10-01 user approved the training-case reference audit recommendations ("응 추천대로 진행해"); f11-r: either cart-side DB-path failure is sufficient for
      mechanism 1'
    title: Redis outage — cache isolation succeeds, but fallback traffic to the DB collapses cart
    cause: 'Redis (testbed-redis) is stopped (its deployment scaled to 0) at injection start while a surge load runs → within seconds commerce-cart logs Redis connection
      timeouts / connection refused, its cartRedis circuit breaker opens and cart reads fall back to PostgreSQL (Redis client calls drop to ~0) → under the surge,
      cart''s own DB path then fails in two observed ways: (a) the cache-write path is not covered by the breaker, so each cart write waits out the ~500 ms Redis
      command timeout while its DB transaction/connection stays open (idle-in-transaction), and with all reads also on the DB cart''s Hikari pool (max 20) is fully
      used within ~75-80 s and connection acquisition times out after 3000 ms from ~+120 s (CannotCreateTransaction / JDBC connection 500s, cart latency ~3 s); (b)
      concurrent fallback writes to the same cart rows fail with optimistic-lock (row was updated or deleted by another transaction) 500s from the first seconds of
      the outage → cart 5xx and multi-second latency propagate to commerce-order, whose checkout transaction holds its own DB connection while calling cart, so order''s
      pool (max 10) is exhausted (30 s acquisition timeouts, health-check timeouts) → the gateway''s order circuit breaker opens and checkout returns 502. PostgreSQL
      itself is not the bottleneck (queries stay fast, sessions below the limit). Required for mechanism 1: Redis loss as the trigger; cart''s circuit breaker opening
